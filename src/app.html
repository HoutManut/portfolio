<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Before paint, so the axis rail never pops in after hydration. Without JS the
		     document keeps the registered initial-value of each axis and the rail stays hidden. -->
		<script>
			document.documentElement.classList.add('js');
		</script>
		<script>
			(function () {
				var palettes = {
					c: {
						field: '#08495e',
						paper: '#f1efe6',
						acid: '#ff974d',
						ink: '#100e0c',
						muted: '#94c2d1',
						rule: '#29758e',
						ruleStrong: '#2e95b8'
					},
					original: {
						field: '#1c22c8',
						paper: '#f1efe6',
						acid: '#d6f03a',
						ink: '#12131a',
						muted: '#a6acee',
						rule: '#5a5fd8',
						ruleStrong: '#7b80e4'
					},
					e: {
						field: '#0f0f0f',
						paper: '#f1efe6',
						acid: '#f87cba',
						ink: '#130a10',
						muted: '#9f7d8e',
						rule: '#4c3e45',
						ruleStrong: '#6d5561'
					},
					f: {
						field: '#0c0f12',
						paper: '#f1efe6',
						acid: '#00b3cf',
						ink: '#080c0e',
						muted: '#698f96',
						rule: '#364245',
						ruleStrong: '#4b5f63'
					}
				};
				var id = localStorage.getItem('theme');
				var palette = palettes[id];
				if (!palette) return;
				var root = document.documentElement.style;
				root.setProperty('--field', palette.field);
				root.setProperty('--paper', palette.paper);
				root.setProperty('--acid', palette.acid);
				root.setProperty('--ink', palette.ink);
				root.setProperty('--muted', palette.muted);
				root.setProperty('--rule', palette.rule);
				root.setProperty('--rule-strong', palette.ruleStrong);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
		THESIS: this site is a type specimen of the typesetting system that prints it — the work
		is the showing. It refuses the portfolio card grid, where the work is a thumbnail.
		OWN-WORLD: one drenched ultramarine field (#1C22C8), warm paper plates for every reading
		field, acid chartreuse for live values and active state; one variable family (Recursive)
		set from 11px tracked mono legends to 4.5rem project titles; hairline rules, no cards,
		no shadows, no rounded corners.
		STORY: a hiring manager sees shipped work at specimen scale in the first viewport, opens a
		project in place, reads the CV against a margin that numbers its sections, and mails from
		the colophon — where the axis rail sits, an instrument to be found rather than met.
		FIRST VIEWPORT: masthead band (name, role, contact), then the project rows begin
		immediately, titles at display scale against a figure cell, ruled not boxed. Nothing
		instrumental precedes the work.
		FORM: the dealt challenger "variable-font-specimen", locked by the user over the roll's
		assignment (grounded candidate 5, the parts plate). Seed key 16b6904d. Code-led: no image
		generation on this machine, so no comp round; the ambition rides in this contract.
		SIGNATURE: the DETAIL axis remaps every project row at once, continuously, via one
		registered custom property; presets interpolate, prefers-reduced-motion snaps between
		named instances.
		FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
		the verdict, DESIGN.md, and every shipping raster carrying its provenance.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
